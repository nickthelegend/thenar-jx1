meta:
  version: 0.3-C
  date: '2026-09-24'
  status: Iteration 1 — actuator classes set to the RobStride envelopes selected in actuators/actuator_selection.md
  note: 'variant C: CAD-derived structure masses after the FEA-driven aluminium redesign (iteration 2)'
frames:
  convention: 'ROS REP-103: x forward, y left, z up. Joint rotation positive by right-hand rule about the listed axis.'
  pelvis_origin: midpoint between the left and right hip centres (hip yaw/roll/pitch axes intersect at each hip centre)
  zero_pose: legs straight and vertical, feet flat and parallel, all joint angles 0
overall:
  height_m:
    value: 1.2
    label: ASSUMED
    note: compact G1-class target envelope 1.1-1.3 m
  mass_target_kg:
    value: 25.0
    label: ASSUMED
geometry:
  sole_to_ankle_m:
    value: 0.05
    label: ASSUMED
    note: ankle pitch/roll intersection above sole (foot plate + rubber + bearing block)
  shin_m:
    value: 0.3
    label: CALCULATED
    note: knee axis to ankle axis; sized to stack knee RS03 + two RS06 ankle motors + fork (reference median 0.27, G1 0.300)
  thigh_m:
    value: 0.27
    label: CALCULATED
    note: hip centre to knee axis (reference median 0.28, Asimov 0.270)
  hip_spacing_m:
    value: 0.2
    label: CALCULATED
    note: gives 60 mm between the medial ankle motors (reference feet spacing 0.19-0.22)
  foot:
    length_m:
      value: 0.21
      label: ASSUMED
    width_m:
      value: 0.095
      label: ASSUMED
    ankle_from_heel_m:
      value: 0.075
      label: ASSUMED
      note: ankle axis projected on sole, measured from heel
    thickness_m:
      value: 0.022
      label: ASSUMED
  torso:
    pelvis_to_shoulder_m:
      value: 0.4
      label: ASSUMED
    shoulder_width_m:
      value: 0.3
      label: ASSUMED
joint_ranges_deg:
  hip_yaw:
    min: -40
    max: 45
    label: ASSUMED
    note: + = toes turn outward (left leg)
  hip_roll:
    min: -25
    max: 45
    label: ASSUMED
    note: + = abduction (left leg)
  hip_pitch:
    min: -115
    max: 35
    label: ASSUMED
    note: '- = flexion (leg forward)'
  knee:
    min: 0
    max: 120
    label: CALCULATED
    note: '+ = flexion; CAD sweep: thigh knee disc clears ankle motor A up to 120 deg (squat needs 117)'
  ankle_pitch:
    min: -55
    max: 30
    label: ASSUMED
    note: '- = dorsiflexion (toes up)'
  ankle_roll:
    min: -20
    max: 20
    label: ASSUMED
actuator_classes:
  XL:
    mass_kg: 1.42
    diameter_m: 0.12
    length_m: 0.056
    reflected_inertia_kgm2: 0.04
    product: RobStride RS04 (120/40 N·m, 9:1)
    label: VERIFIED
  L:
    mass_kg: 0.88
    diameter_m: 0.106
    length_m: 0.056
    reflected_inertia_kgm2: 0.02
    product: RobStride RS03 (60/20 N·m, 9:1)
    label: VERIFIED
  M:
    mass_kg: 0.621
    diameter_m: 0.088
    length_m: 0.049
    reflected_inertia_kgm2: 0.01
    product: RobStride RS06 (36/11 N·m, 9:1)
    label: VERIFIED
  S:
    mass_kg: 0.405
    diameter_m: 0.0785
    length_m: 0.0455
    reflected_inertia_kgm2: 0.0035
    product: RobStride RS02 (17/6 N·m, 7.75:1)
    label: VERIFIED
  XS:
    mass_kg: 0.31
    diameter_m: 0.057
    length_m: 0.051
    reflected_inertia_kgm2: 0.002
    product: RobStride RS00 (14/5 N·m, 10:1)
    label: VERIFIED
leg_actuator_assignment:
  hip_yaw: M
  hip_roll: L
  hip_pitch: XL
  knee: XL
  ankle_A: M
  ankle_B: M
ankle_linkage:
  crank_radius_m:
    value: 0.05
    label: CALCULATED
    note: 'reach sweep: -55..+35 pitch, +-20 roll reachable, cond(J) <= 1.17, crank swing <= 59 deg'
  foot_lever_m:
    value: 0.04
    label: CALCULATED
    note: rod-end posts behind the ankle pitch axis
  rod_half_spacing_m:
    value: 0.045
    label: ASSUMED
    note: lateral offset of each rod end on the foot
  crank_half_spacing_m:
    value: 0.057
    label: CALCULATED
    note: web/2 + RS06 housing+output + crank/2; rods lean in 12 mm
  motor_A_height_above_ankle_m:
    value: 0.182
    label: CALCULATED
    note: upper motor, output lateral; 118 mm below knee axis (clears RS04 knee + thigh disc at 120 deg)
  motor_B_height_above_ankle_m:
    value: 0.094
    label: CALCULATED
    note: lower motor, output medial; 10 mm above the ankle fork
  motor_height_above_ankle_m:
    value: 0.138
    label: CALCULATED
    note: mean, used by the lumped mass model
  coupled_limit_polygon_deg:
    value:
    - - -55
      - -20
    - - 5
      - -20
    - - 30
      - 0
    - - 30
      - 15
    - - 20
      - 20
    - - -55
      - 20
    label: CALCULATED
    note: SolidWorks interference sweep, 5 deg grid, 162 poses, 92 % of the box collision-free; polygon keeps 2-5 deg to first contact (verification/ankle_workspace_L.json)
mass_budget:
  pelvis:
    structure_kg:
      value: 1.394
      label: CALCULATED
      note: CAD components (JX1_Pelvis) + 5% fasteners
    carries:
    - hip_yaw
    - hip_yaw
    com_m:
    - 0.0
    - 0.0
    - 0.05
  upper_body:
    mass_kg:
      value: 12.015
      label: CALCULATED
      note: 'phase-2 CAD: torso frame, battery, Jetson, electronics, waist output, arms, grippers, neck, head (zero pose)'
    com_m:
    - -0.0108
    - 0.0005
    - 0.2898
    inertia_box_m:
    - 0.2
    - 0.3
    - 0.45
  hip_yaw_link:
    structure_kg:
      value: 0.901
      label: CALCULATED
      note: CAD components (JX1_HipYawBracket_L) + 5% fasteners
    carries:
    - hip_roll
    com_m:
    - -0.01
    - 0.0
    - 0.02
  hip_roll_link:
    structure_kg:
      value: 0.475
      label: CALCULATED
      note: CAD components (JX1_HipRollBracket_L) + 5% fasteners
    carries:
    - hip_pitch
    com_m:
    - 0.0
    - 0.045
    - 0.0
  thigh:
    structure_kg:
      value: 0.911
      label: CALCULATED
      note: CAD components (JX1_Thigh_L) + 5% fasteners
    carries:
    - knee
    com_m:
    - 0.0
    - 0.0
    - -0.205
  shin:
    structure_kg:
      value: 1.504
      label: CALCULATED
      note: CAD components (JX1_AnkleCrank, JX1_AnkleRod_A, JX1_AnkleRod_B, JX1_Shin_L) + 5% fasteners
    carries:
    - ankle_A
    - ankle_B
    com_m:
    - 0.0
    - 0.0
    - -0.095
  ankle_cross:
    structure_kg:
      value: 0.202
      label: CALCULATED
      note: CAD components (JX1_AnkleCross) + 5% fasteners
    carries: []
    com_m:
    - 0.0
    - 0.0
    - 0.0
  foot:
    structure_kg:
      value: 0.523
      label: CALCULATED
      note: CAD components (JX1_Foot_L) + 5% fasteners
    carries: []
    com_m:
    - 0.03
    - 0.0
    - -0.035
upper_body_geometry:
