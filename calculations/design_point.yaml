# JX1 design point — single source of truth for the parametric analysis model.
# Every value carries an evidence label: VERIFIED / MEASURED / CALCULATED / ESTIMATED / ASSUMED / UNVERIFIED.
# Iteration history is recorded in calculations/README.md. SolidWorks global variables mirror the geometry block.
meta:
  version: "0.3"
  date: "2026-09-24"
  status: "Iteration 1 — actuator classes set to the RobStride envelopes selected in actuators/actuator_selection.md"

frames:
  convention: "ROS REP-103: x forward, y left, z up. Joint rotation positive by right-hand rule about the listed axis."
  pelvis_origin: "midpoint between the left and right hip centres (hip yaw/roll/pitch axes intersect at each hip centre)"
  zero_pose: "legs straight and vertical, feet flat and parallel, all joint angles 0"

overall:
  height_m: {value: 1.20, label: ASSUMED, note: "compact G1-class target envelope 1.1-1.3 m"}
  mass_target_kg: {value: 25.0, label: ASSUMED}

geometry:
  sole_to_ankle_m: {value: 0.050, label: ASSUMED, note: "ankle pitch/roll intersection above sole (foot plate + rubber + bearing block)"}
  shin_m: {value: 0.300, label: CALCULATED, note: "knee axis to ankle axis; sized to stack knee RS03 + two RS06 ankle motors + fork (reference median 0.27, G1 0.300)"}
  thigh_m: {value: 0.270, label: CALCULATED, note: "hip centre to knee axis (reference median 0.28, Asimov 0.270)"}
  hip_spacing_m: {value: 0.200, label: CALCULATED, note: "gives 60 mm between the medial ankle motors (reference feet spacing 0.19-0.22)"}
  foot:
    length_m: {value: 0.210, label: ASSUMED}
    width_m: {value: 0.095, label: ASSUMED}
    ankle_from_heel_m: {value: 0.075, label: ASSUMED, note: "ankle axis projected on sole, measured from heel"}
    thickness_m: {value: 0.022, label: ASSUMED}
  torso:
    pelvis_to_shoulder_m: {value: 0.400, label: ASSUMED}
    shoulder_width_m: {value: 0.300, label: ASSUMED}

# Joint order per leg from the pelvis: hip_yaw (z) -> hip_roll (x) -> hip_pitch (y) -> knee (y) -> ankle_pitch (y) -> ankle_roll (x)
# Ranges are for the LEFT leg in degrees; the right leg mirrors roll/yaw signs.
joint_ranges_deg:
  hip_yaw:     {min: -40,  max: 45,  label: ASSUMED, note: "+ = toes turn outward (left leg)"}
  hip_roll:    {min: -25,  max: 45,  label: ASSUMED, note: "+ = abduction (left leg)"}
  hip_pitch:   {min: -115, max: 35,  label: ASSUMED, note: "- = flexion (leg forward)"}
  knee:        {min: 0,    max: 120, label: CALCULATED, note: "+ = flexion; CAD sweep: thigh knee disc clears ankle motor A up to 120 deg (squat needs 117)"}
  ankle_pitch: {min: -55,  max: 30,  label: ASSUMED, note: "- = dorsiflexion (toes up)"}
  ankle_roll:  {min: -20,  max: 20,  label: ASSUMED}

# Actuator classes (iteration 1): masses/dims VERIFIED from official RobStride specs (research/raw/actuator_technology_raw.md);
# reflected inertia ESTIMATED (rotor inertia not published: scaled from motor size x ratio^2).
actuator_classes:
  XL: {mass_kg: 1.420, diameter_m: 0.120, length_m: 0.056, reflected_inertia_kgm2: 0.040, product: "RobStride RS04 (120/40 N·m, 9:1)", label: VERIFIED}
  L:  {mass_kg: 0.880, diameter_m: 0.106, length_m: 0.056, reflected_inertia_kgm2: 0.020, product: "RobStride RS03 (60/20 N·m, 9:1)", label: VERIFIED}
  M:  {mass_kg: 0.621, diameter_m: 0.088, length_m: 0.049, reflected_inertia_kgm2: 0.010, product: "RobStride RS06 (36/11 N·m, 9:1)", label: VERIFIED}
  S:  {mass_kg: 0.405, diameter_m: 0.0785, length_m: 0.0455, reflected_inertia_kgm2: 0.0035, product: "RobStride RS02 (17/6 N·m, 7.75:1)", label: VERIFIED}
  XS: {mass_kg: 0.310, diameter_m: 0.057, length_m: 0.051, reflected_inertia_kgm2: 0.002, product: "RobStride RS00 (14/5 N·m, 10:1)", label: VERIFIED}

leg_actuator_assignment:
  hip_yaw: M
  hip_roll: L
  hip_pitch: XL   # iteration-1 variant B: only configuration meeting peak/continuous/speed with policy factors
  knee: XL
  ankle_A: M      # parallel ankle, two RS06 on the shin driving push rods (crank 50 / foot lever 40 mm)
  ankle_B: M

# Parallel ankle geometry (two cranks on the shin, two push rods to the foot)
ankle_linkage:
  crank_radius_m: {value: 0.050, label: CALCULATED, note: "reach sweep: -55..+35 pitch, +-20 roll reachable, cond(J) <= 1.17, crank swing <= 59 deg"}
  foot_lever_m: {value: 0.040, label: CALCULATED, note: "rod-end posts behind the ankle pitch axis"}
  rod_half_spacing_m: {value: 0.045, label: ASSUMED, note: "lateral offset of each rod end on the foot"}
  crank_half_spacing_m: {value: 0.057, label: CALCULATED, note: "web/2 + RS06 housing+output + crank/2; rods lean in 12 mm"}
  motor_A_height_above_ankle_m: {value: 0.182, label: CALCULATED, note: "upper motor, output lateral; 118 mm below knee axis (clears RS04 knee + thigh disc at 120 deg)"}
  motor_B_height_above_ankle_m: {value: 0.094, label: CALCULATED, note: "lower motor, output medial; 10 mm above the ankle fork"}
  motor_height_above_ankle_m: {value: 0.138, label: CALCULATED, note: "mean, used by the lumped mass model"}

# Mass budget per link (structure + mounted actuator housings). COM in the link frame (m).
# Link frames sit at the joint that drives them; legs hang along -z in the zero pose.
mass_budget:
  pelvis:
    structure_kg: {value: 0.90, label: ASSUMED}
    carries: [hip_yaw, hip_yaw]          # both hip-yaw actuator housings live in the pelvis
    com_m: [0.0, 0.0, 0.050]
  upper_body:
    mass_kg: {value: 12.0, label: ASSUMED, note: "torso structure, waist, battery, Jetson, electronics, arms, head; lumped rigid to pelvis for leg analysis"}
    com_m: [0.0, 0.0, 0.260]
    inertia_box_m: [0.20, 0.30, 0.45]
  hip_yaw_link:
    structure_kg: {value: 0.20, label: ASSUMED}
    carries: [hip_roll]
    com_m: [-0.010, 0.0, 0.020]
  hip_roll_link:
    structure_kg: {value: 0.20, label: ASSUMED}
    carries: [hip_pitch]
    com_m: [0.0, 0.045, 0.0]
  thigh:
    structure_kg: {value: 0.45, label: ASSUMED}
    carries: [knee]
    com_m: [0.0, 0.0, -0.205]
  shin:
    structure_kg: {value: 0.45, label: ASSUMED, note: "includes push rods"}
    carries: [ankle_A, ankle_B]
    com_m: [0.0, 0.0, -0.095]
  ankle_cross:
    structure_kg: {value: 0.05, label: ASSUMED}
    carries: []
    com_m: [0.0, 0.0, 0.0]
  foot:
    structure_kg: {value: 0.35, label: ASSUMED}
    carries: []
    com_m: [0.030, 0.0, -0.035]

# Upper-body kinematic layout (ASSUMED iteration 0). Offsets are joint origins in the PARENT link frame (m).
upper_body_geometry:
  waist_yaw_origin: {value: [0.0, 0.0, 0.110], label: ASSUMED, note: "pelvis -> torso yaw axis (vertical, through pelvis centre)"}
  shoulder_pitch_origin: {value: [0.0, 0.150, 0.290], label: ASSUMED, note: "torso -> left shoulder centre (right mirrors y)"}
  shoulder_roll_offset: {value: [0.0, 0.045, 0.0], label: ASSUMED}
  shoulder_yaw_offset: {value: [0.0, 0.0, -0.070], label: ASSUMED}
  elbow_offset: {value: [0.0, 0.0, -0.130], label: ASSUMED, note: "upper arm total 0.200 m shoulder centre -> elbow"}
  hand_offset: {value: [0.0, 0.0, -0.180], label: ASSUMED, note: "forearm length to gripper mount"}
  neck_yaw_origin: {value: [0.0, 0.0, 0.330], label: ASSUMED}
  neck_pitch_offset: {value: [0.0, 0.0, 0.040], label: ASSUMED}
  head_top_above_neck_pitch_m: {value: 0.130, label: ASSUMED}

upper_body_joint_ranges_deg:
  waist_yaw:      {min: -90,  max: 90,  label: ASSUMED}
  shoulder_pitch: {min: -170, max: 60,  label: ASSUMED, note: "- = arm raises forward"}
  shoulder_roll:  {min: -10,  max: 150, label: ASSUMED, note: "+ = abduction (left arm)"}
  shoulder_yaw:   {min: -90,  max: 90,  label: ASSUMED}
  elbow:          {min: -135, max: 5,   label: ASSUMED, note: "- = flexion (forearm lifts forward)"}
  neck_yaw:       {min: -80,  max: 80,  label: ASSUMED}
  neck_pitch:     {min: -30,  max: 45,  label: ASSUMED, note: "+ = look down"}
