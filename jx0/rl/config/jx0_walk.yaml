# JX0 velocity-tracking walking task, for JX1's training stack (rl/: MuJoCo; simulation/isaac/isaaclab: Isaac Lab).
# Same layout as rl/config/jx1_walk.yaml; the numbers are JX0's: a 2.9 kg, 0.33 m robot with 17 STS3215 servos.
#   train:  rl/.venv/Scripts/python rl/train.py --config jx0/rl/config/jx0_walk.yaml
#   export: rl/.venv/Scripts/python rl/export.py --checkpoint rl/runs/<run>/model_<it>.pt --out jx0/rl/policies/<name>
# The robot description (MJCF, joint map, URDF) is generated by jx0/rl/build_description.py from the verified model.
name: jx0_walk_flat

model:
  source_mjcf: jx0/rl/description/jx0.xml
  joint_map: jx0/rl/description/joint_map.yaml
  urdf: jx0/rl/description/urdf/jx0.urdf      # Isaac Lab (URDF importer); a USD next to it is used when present
  usd: jx0/rl/description/jx0.usd
  timestep: 0.002                             # physics 500 Hz: light links (feet 60 g) on stiff servos
  decimation: 10                              # policy 50 Hz; the Pi sends the servo goals at 100 Hz (config.yaml bus)
  solver_iterations: 50
  ls_iterations: 50
  contact_solref: [0.004, 1.0]                # >= 2 x timestep
  floor_friction: 1.0
  hub_interpolation: true                     # goals ramp over the policy period (the Pi interpolates to 100 Hz)

policy_joints:
  - left_hip_yaw_joint
  - left_hip_roll_joint
  - left_hip_pitch_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_yaw_joint
  - right_hip_roll_joint
  - right_hip_pitch_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint

# action 0 = the verified walking stance (jx0bot gaits, knees bent); arms and neck hold this pose
default_joint_pos:
  left_hip_pitch_joint: -0.47
  left_knee_joint: 0.94
  left_ankle_pitch_joint: -0.47
  right_hip_pitch_joint: -0.47
  right_knee_joint: 0.94
  right_ankle_pitch_joint: -0.47
  left_elbow_joint: -0.35
  right_elbow_joint: -0.35

# every joint is an STS3215 in position mode: its P and D registers set to config.yaml's stiffness and damping
pd_gains:
  hip_yaw: [60.0, 0.6]
  hip_roll: [60.0, 0.6]
  hip_pitch: [60.0, 0.6]
  knee: [60.0, 0.6]
  ankle_pitch: [60.0, 0.6]
  ankle_roll: [60.0, 0.6]
  shoulder_pitch: [60.0, 0.6]
  elbow: [60.0, 0.6]
  neck_yaw: [60.0, 0.6]

action_scale: 0.25

observation:
  scales: {ang_vel: 0.25, dof_pos: 1.0, dof_vel: 0.05, lin_vel: 10.0, commands: [10.0, 10.0, 1.0]}
  clip: 100.0
  noise: {ang_vel: 0.2, gravity: 0.05, dof_pos: 0.01, dof_vel: 1.5}

gait:
  period_s: 1.0                                # the verified gaits take 0.6 s steps; STS3215s turn at 4.7 rad/s at most
  offset: 0.5
  stance_fraction: 0.55
  swing_height_m: 0.02
  stand_command_threshold: 0.02
  stand_contact_reward: none

commands:
  resample_s: 10.0
  zero_fraction: 0.1
  ranges: {lin_vel_x: [-0.05, 0.12], lin_vel_y: [-0.05, 0.05], ang_vel_yaw: [-0.4, 0.4]}

episode_s: 20.0

termination:
  min_base_height_m: 0.10                      # the pelvis stands ~0.19 m up in the stance
  max_tilt_deg: 60.0

rewards:                                         # JX1's terms; the length-scaled ones rescaled for a 0.33 m robot
  tracking_lin_vel: 1.0
  tracking_ang_vel: 0.8
  tracking_sigma: 0.01                           # speeds are ~8x smaller than JX1's (0.25 there)
  lin_vel_z: -2.0
  ang_vel_xy: -0.05
  orientation: -1.0
  base_height: -100.0
  torques: -1.0e-3                               # torques ~1 N m, not ~50
  torque_limits: -0.5
  soft_torque_limit: 0.85                        # of the 2.94 N m stall torque: the servos' headroom
  dof_vel: -1.0e-3
  dof_acc: -2.5e-7
  action_rate: -0.01
  dof_pos_limits: -5.0
  alive: 0.15
  hip_pos: -1.0
  contact: 0.18
  feet_swing_height: -300.0                      # 0.02 m swing target: (0.08 / 0.02)^2 x JX1's -20
  contact_no_vel: -2.0
  stand_still: -0.5
  termination: -200.0

randomization:
  model_variants: 16
  friction: [0.4, 1.25]
  added_base_mass_kg: [-0.1, 0.3]                # battery / wiring uncertainty on a 2.9 kg robot
  base_com_offset_m: 0.005
  link_mass_scale: [0.9, 1.1]
  kp_scale: [0.6, 1.4]                           # servo stiffness ASSUMED 60 N m/rad: the walking was verified 0.6-1.4x
  kd_scale: [0.6, 1.5]
  armature_scale: [0.8, 1.2]
  joint_friction_scale: [0.5, 2.0]
  push_interval_s: 5.0
  push_velocity_m_s: 0.1
  init_joint_noise: 0.05
  init_base_vel: 0.05
  action_delay_substeps: [2, 8]                  # 4-16 ms: serial bus + the servo's own response
  obs_delay_substeps: [1, 5]                     # 2-10 ms: reading 12 servo positions over the bus, the IMU

ppo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 3000
  actor_hidden: [256, 128, 64]
  critic_hidden: [512, 256, 128]
  activation: elu
  init_noise_std: 0.8
  learning_rate: 1.0e-3
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
  symmetry_coef: 0.2                             # left/right mirror loss (JX1's walk_v6 setting)
  save_interval: 100
