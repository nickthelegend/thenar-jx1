# JX0 whole-body walking policy: all 17 STS3215 servos (legs, arms, neck), 50 Hz, 176 observations (3 frames of
# history). For Isaac Lab (Isaac-Velocity-Flat-JX0-Full-v0, jx0\setup\train_isaac.bat) and for rl/train.py (MuJoCo).
# Everything not set here comes from jx0_walk.yaml.
base: jx0_walk.yaml
name: jx0_walk17
isaac_task: Isaac-Velocity-Flat-JX0-Full

policy_joints:
  - left_hip_yaw_joint
  - left_hip_roll_joint
  - left_hip_pitch_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_yaw_joint
  - right_hip_roll_joint
  - right_hip_pitch_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
  - left_shoulder_pitch_joint
  - left_elbow_joint
  - right_shoulder_pitch_joint
  - right_elbow_joint
  - neck_yaw_joint

# actor observation = [ang_vel x3, gravity x3, command, (q - q0) x3, dq x3, last action x3, sin, cos], each history
# oldest frame first (Isaac Lab's per-term history): 3 x (6 + 3 x 17) + 5 = 176 values; actions = 17 joint corrections
# (target = default + 0.25 x action, rad)
observation:
  history_length: 3

# the policy's 17 outputs are corrections to the robot's verified gaits: target = q_ref(phase, command) + 0.25 x action,
# q_ref blended from the forward / backward / sideways / turning gait cycles (jx0/rl/gait_reference.py). With zero
# corrections the robot walks the verified gaits; the policy learns balance, push recovery and the speeds between.
action:
  reference: jx0/rl/config/jx0_gait_reference.json

gait:                                            # the verified gaits' clock: 0.6 s steps, the foot down 62.5 % of a cycle
  period_s: 1.2
  stance_fraction: 0.625

commands:
  ranges: {lin_vel_x: [-0.05, 0.10], lin_vel_y: [-0.03, 0.03], ang_vel_yaw: [-0.4, 0.4]}

rewards:
  ref_joint_pos: 1.0                             # stay near the reference (jx0_walk17_v1-v3 learned without one: they
  #                                                stood or stepped in place)
  tracking_lin_scale: [0.10, 0.03]               # x / y errors in units of the command ranges' largest speeds
  tracking_sigma: 0.25                           # in those units: standing still when told 0.06 m/s forward -> 0.37
  tracking_sigma_ang: 0.05
  hip_pos: 0.0                                   # the reference gait rolls the hips +-0.24 rad to shift weight, swings the
  upper_body_pos: 0.0                            # arms: ref_joint_pos (all 17 joints) replaces both posture terms
  torque_limits: -0.05                           # N m above 0.85 x stall: -0.5 (jx0_walk) outweighed every reward in
  dof_vel_limits: -0.05                          # jx0_walk17_v2 (-1.2 per s vs +0.7 for stepping): it stood still

randomization:
  kp_scale: [0.7, 1.3]
  kd_scale: [0.7, 1.4]
  action_delay_substeps: [1, 6]                  # 2-12 ms
  obs_delay_substeps: [1, 4]                     # 2-8 ms
  push_velocity_m_s: 0.15

ppo:
  init_noise_std: 0.3                            # corrections: explore around the reference, not 0.2 rad away from it
  actor_output_gain: 0.01                        # the untrained policy's corrections start near 0 (the verified gait)
  actor_hidden: [512, 256, 128]
  critic_hidden: [512, 256, 128]
