observation:
  size: 47
  layout:
  - base_ang_vel_body x3 (rad/s) * scales.ang_vel
  - projected_gravity_body x3
  - command (vx m/s, vy m/s, wz rad/s) * scales.commands
  - joint_pos - default (policy joints) * scales.dof_pos
  - joint_vel (policy joints) * scales.dof_vel
  - last_action (raw policy output)
  - sin(2 pi phase), 0 in stand mode
  - cos(2 pi phase), 0 in stand mode
  scales:
    ang_vel: 0.25
    dof_pos: 1.0
    dof_vel: 0.05
    lin_vel: 10.0
    commands:
    - 10.0
    - 10.0
    - 1.0
  clip: 100.0
gait:
  period_s: 1.0
  offset: 0.5
  stance_fraction: 0.55
  swing_height_m: 0.02
  stand_command_threshold: 0.02
  stand_contact_reward: none
commands:
  lin_vel_x:
  - -0.05
  - 0.12
  lin_vel_y:
  - -0.05
  - 0.05
  ang_vel_yaw:
  - -0.4
  - 0.4
targets: q_target = clip(default + action_scale * action, joint limits); ankle (pitch, roll) targets projected into ankle_polygons_rad; left_hip_yaw
  - right_hip_yaw <= hip_yaw_toe_out_max_rad (excess taken off both hips equally)
