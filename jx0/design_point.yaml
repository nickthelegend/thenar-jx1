# JX0 design point — the small (~46 cm, ~2.8 kg) 3D-printed MVP humanoid. Same schema as calculations/design_point.yaml
# (JX1), so the JX1 analysis pipeline (jx1calc: parametric model, ZMP preview-control gait, whole-body IK, inverse
# dynamics) sizes it unchanged. Every value carries an evidence label: VERIFIED / MEASURED / CALCULATED / ESTIMATED /
# ASSUMED / UNVERIFIED. Masses are ASSUMED until the CAD mass properties replace them.
meta:
  version: "0.4"
  date: "2026-10-04"
  status: "v0.3 (2026-10-04): restyled after the reference robot (media/reference.mp4); all 17 joints Feetech STS3215 12 V; sage PETG; Raspberry Pi 4"

frames:
  convention: "ROS REP-103: x forward, y left, z up. Joint rotation positive by right-hand rule about the listed axis."
  pelvis_origin: "midpoint between the left and right hip centres (hip yaw/roll/pitch axes intersect at each hip centre)"
  zero_pose: "legs straight and vertical, feet flat and parallel, arms hanging, all joint angles 0"

overall:
  height_m: {value: 0.460, label: CALCULATED, note: "v0.4 CAD: sole 153 mm below the hip centres, head top 306.6 mm above"}
  mass_target_kg: {value: 2.0, label: ESTIMATED}

geometry:
  sole_to_ankle_m: {value: 0.033, label: CALCULATED, note: "v0.4 CAD: sole 5 mm + the ankle-roll servo's cage clearance at 20 deg roll; reference robot ~25 mm"}
  shin_m: {value: 0.058, label: CALCULATED, note: "v0.4 CAD: knee axis to ankle axis (reference robot ~46 mm); the ankle-pitch servo stands in a cage under the knee's U-bracket"}
  thigh_m: {value: 0.062, label: CALCULATED, note: "v0.4 CAD: hip centre to knee axis (reference robot ~63 mm); the knee servo lies forward so the thigh is the reference's dog-leg plate"}
  knee_actuator_z_m: {value: -0.062, label: CALCULATED, note: "knee servo on the knee axis (its case centre is 12.5 mm forward: actuator_offsets_m.knee)"}
  hip_spacing_m: {value: 0.090, label: ASSUMED, note: "two hip roll/pitch servo blocks side by side (servo body 45 x 25 mm)"}
  foot:
    length_m: {value: 0.124, label: CALCULATED, note: "v0.4 CAD foot x -68..56 mm: the roll U-bracket's rear arm sits over the heel"}
    width_m: {value: 0.070, label: CALCULATED}
    ankle_from_heel_m: {value: 0.068, label: CALCULATED, note: "CAD foot x -68..56 mm"}
    thickness_m: {value: 0.006, label: CALCULATED, note: "PETG sole 5 mm + 1 mm rubber"}
  torso:
    pelvis_to_shoulder_m: {value: 0.140, label: ASSUMED}
    shoulder_width_m: {value: 0.170, label: ASSUMED}

ankle_type: serial   # one servo per ankle axis (JX1 uses a two-motor parallel ankle)

# Joint order per leg: hip_yaw (z) -> hip_roll (x) -> hip_pitch (y) -> knee (y) -> ankle_pitch (y) -> ankle_roll (x).
# LEFT leg ranges in degrees; the right leg mirrors roll/yaw. Limits are set by the printed brackets (ASSUMED).
joint_ranges_deg:
  hip_yaw:     {min: -30,  max: 30,  label: CALCULATED, note: "+ = toes out (left leg); CAD own-limb clear to +-40 (verify_cad)"}
  hip_roll:    {min: -20,  max: 22,  label: CALCULATED, note: "+ = abduction (left leg); CAD own-limb clear -22..25 (the roll U-bracket and the thigh meet the yaw disc)"}
  hip_pitch:   {min: -70,  max: 8,   label: CALCULATED, note: "- = flexion (leg forward); CAD clear -75 (thigh meets the hip-roll bracket) .. +12 (the hip-yaw bracket)"}
  knee:        {min: 0,    max: 84,  label: CALCULATED, note: "+ = flexion; CAD clear to 87 from the walking stance (75 with the hip straight: no action does that)"}
  ankle_pitch: {min: -55,  max: 15,  label: CALCULATED, note: "- = dorsiflexion (toes up); CAD clear -75..17"}
  ankle_roll:  {min: -20,  max: 20,  label: CALCULATED, note: "CAD own-limb clear -20..22 (the sole meets the roll servo's cage; the foot's bracket swings under the ankle bracket's arms)"}

# One actuator class for all 17 joints (legs, arms, neck): the Feetech STS3215 12 V serial bus servo (Evelta sells it as
# ST3215-C018; Waveshare as ST3215).
# Case 45.2 x 24.7 x 32 mm, 89 g (Waveshare drawing and product page); the cylinder model below only feeds the
# inertia estimate. Reflected rotor inertia ASSUMED: ~0.4 g·cm² rotor x (1:345 gearbox)^2 ≈ 0.005 kg·m² — hobby servos are
# NOT back-drivable, so this is large relative to the links; the sizing report shows its effect.
actuator_classes:
  ST: {mass_kg: 0.089, diameter_m: 0.035, length_m: 0.045, reflected_inertia_kgm2: 0.005,
       stall_torque_nm: 2.94, rated_torque_nm: 0.98, no_load_speed_rad_s: 4.72,
       product: "Feetech STS3215 12 V serial bus servo (ST3215-C018 / Waveshare ST3215; 30 kg·cm stall, 10 kg·cm rated at 12 V)", label: VERIFIED,
       note: "Waveshare product page: 30 kg·cm and 0.222 s/60 deg (45 rpm) at 12 V, 0.089 kg; Evelta: 10 kg·cm rated. Reflected inertia ASSUMED. research/raw/jx0_india_sourcing_raw.md"}

leg_actuator_assignment:
  hip_yaw: ST
  hip_roll: ST
  hip_pitch: ST
  knee: ST
  ankle_A: ST     # serial ankle: ankle-pitch servo in the bottom of the shin
  ankle_B: ST     # ankle-roll servo in the ankle block (lumped on the shin just above the ankle axis)

# The analysis code reads the parallel-ankle block of JX1. JX0 drives the ankle directly (serial), so only the motor
# heights matter here (they place the two ankle servos' mass); crank/lever values are placeholders with ratio 1.
ankle_linkage:
  crank_radius_m: {value: 0.020, label: ASSUMED, note: "unused by JX0 (serial ankle)"}
  foot_lever_m: {value: 0.020, label: ASSUMED, note: "unused by JX0 (serial ankle)"}
  rod_half_spacing_m: {value: 0.0, label: ASSUMED, note: "0 = no roll coupling: the serial ankle maps motor = joint"}
  crank_half_spacing_m: {value: 0.0, label: ASSUMED}
  motor_A_height_above_ankle_m: {value: 0.0125, label: CALCULATED, note: "CAD: ankle-pitch servo case centre 12.5 mm above the ankle axis"}
  motor_B_height_above_ankle_m: {value: 0.0, label: CALCULATED, note: "unused in v0.4: the roll servo rides on the ankle cross (layout.ankle_roll_actuator_m)"}
  motor_height_above_ankle_m: {value: 0.006, label: CALCULATED}

# Smaller-robot layout (jx1calc.design reads this block; JX1 uses the defaults)
layout:
  pelvis_box_m: [0.051, 0.124, 0.018]
  hip_yaw_actuator_z_m: 0.0486          # CAD: hip-yaw servo centre 48.6 mm above the hip centre (inside the torso skirt)
  actuator_offsets_m:
    hip_roll: [-0.0326, -0.0125, 0.0]   # CAD: hip-roll servo behind the hip centre (case toward the robot's centre)
    hip_pitch: [0.0125, 0.0, 0.0]       # CAD: hip-pitch servo case forward of the hip centre
    knee: [0.0125, 0.0, -0.062]         # CAD v0.4: knee servo lying forward of the knee axis
  ankle_roll_actuator_m: [-0.0406, -0.0125, 0.0]   # CAD v0.4: ankle-roll servo on the ankle cross, behind the ankle (case inboard)
  ankle_actuator_y_m: 0.0
  structure_box_m:
    hip_yaw_link: [0.06, 0.05, 0.04]
    hip_roll_link: [0.06, 0.05, 0.035]
    thigh: [0.05, 0.045, 0.062]
    shin: [0.035, 0.045, 0.058]
    ankle_cross: [0.07, 0.05, 0.035]

# Mass budget per link (printed structure + mounted servos, via `carries`). COM in the link frame (m).
mass_budget:
  pelvis:
    structure_kg: {value: 0.063, label: ESTIMATED, note: "v0.4 SolidWorks: JX0_Pelvis 55.0 g printed (PETG, near-solid: 6 walls, 40 % gyroid) + screws and inserts"}
    carries: [hip_yaw, hip_yaw]
    com_m: [0.001, 0.0, 0.056]
  upper_body:
    mass_kg: {value: 1.182, label: ESTIMATED, note: "v0.4: CAD printed torso with skirt 106 g + chest cap 46 g + head 67 g + arms 76 g (hood/elbow box 22.7 + blade 15.3 g per side); 5 STS3215 (neck, 2 shoulder, 2 elbow: the shoulder and elbow servos ride in the arms) 445 g; Pi 4 + case 86 g, 3S 2200 mAh LiPo ~185 g, servo driver + UBEC 30 g, IMU/mic/amp/speaker/button 20 g, switch 10 g, wiring 70 g, screws 25 g"}
    com_m: [0.005, 0.0, 0.143]
    inertia_box_m: [0.08, 0.17, 0.20]
  hip_yaw_link:
    structure_kg: {value: 0.056, label: ESTIMATED, note: "v0.4 SolidWorks: hip-yaw bracket 51.0 g printed (9 mm disc, keel, solid block, roll-servo cage) + screws"}
    carries: [hip_roll]
    com_m: [-0.028, -0.010, 0.015]
  hip_roll_link:
    structure_kg: {value: 0.033, label: ESTIMATED, note: "v0.4 SolidWorks: hip-roll U-bracket 29.0 g printed + screws"}
    carries: [hip_pitch]
    com_m: [-0.012, 0.007, 0.002]
  thigh:
    structure_kg: {value: 0.048, label: ESTIMATED, note: "v0.4 SolidWorks: thigh 44.3 g printed (dog-leg U-bracket + knee cage) + screws"}
    carries: [knee]
    com_m: [0.012, -0.002, -0.043]
  shin:
    structure_kg: {value: 0.029, label: ESTIMATED, note: "v0.4 SolidWorks: shin 25.2 g printed (knee U-bracket + ankle-pitch cage) + screws"}
    carries: [ankle_A]
    com_m: [0.002, -0.003, -0.025]
  ankle_cross:
    structure_kg: {value: 0.040, label: ESTIMATED, note: "v0.4 SolidWorks: ankle bracket 35.9 g printed (U-bracket + closed roll cage) + screws; carries the ankle-roll servo (layout.ankle_roll_actuator_m)"}
    carries: [ankle_B]
    com_m: [-0.031, 0.001, 0.0]
  foot:
    structure_kg: {value: 0.061, label: ESTIMATED, note: "v0.4 SolidWorks: foot 51.1 g printed (sole + roll U-bracket) + 1 mm rubber pad + screws"}
    carries: []
    com_m: [-0.014, 0.0, -0.026]

# Upper body (arms and head) — used by the simulation model; lumped into upper_body for the leg analysis.
upper_body_geometry:
  shoulder_pitch_origin: {value: [0.0125, 0.063, 0.186], label: CALCULATED, note: "CAD v0.4: the shoulder servo's horn face on the chest-wall pad (the servo hangs outside, in the arm's hood)"}
  upper_arm_m: {value: 0.052, label: CALCULATED, note: "CAD: shoulder-pitch axis to elbow axis (hood + elbow box)"}
  forearm_m: {value: 0.100, label: CALCULATED, note: "CAD: elbow axis to blade tip"}
  neck_yaw_origin: {value: [0.0, 0.0, 0.244625], label: CALCULATED, note: "CAD: neck STS3215 standing on the chest cap, horn face"}
  head_size_m: {value: [0.066, 0.078, 0.062], label: CALCULATED, note: "CAD head: soft block, four face holes"}

upper_body_joint_ranges_deg:
  shoulder_pitch: {min: -180, max: 60,  label: ASSUMED, note: "- = arm raises forward (the cradle swings past the torso side)"}
  elbow:          {min: -130, max: 30,  label: ASSUMED, note: "- = blade swings forward"}
  neck_yaw:       {min: -80,  max: 80,  label: ASSUMED}
