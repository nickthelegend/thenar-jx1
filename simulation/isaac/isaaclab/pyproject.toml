[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jx1_isaaclab"
version = "0.1.0"
description = "Isaac Lab velocity-tracking task for the JX1 humanoid (same task as rl/config/jx1_walk.yaml in MuJoCo)"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[tool.setuptools]
packages = ["jx1_isaaclab", "jx1_isaaclab.agents"]
